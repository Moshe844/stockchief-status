name: Monitor staging status
on:
  schedule:
    # A run lasts about five and a half hours. This keeps one queued behind it,
    # and restarts monitoring if the running one ever dies.
    - cron: '3,33 * * * *'
  workflow_dispatch:
  push:
    branches: ['main']
    paths: ['loop.mjs','monitor.mjs','monitor.test.mjs','.github/workflows/status.yml']
permissions:
  actions: write
  contents: write
  issues: write
concurrency:
  group: staging-status
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: node --test monitor.test.mjs
      - name: Check every five minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node loop.mjs
