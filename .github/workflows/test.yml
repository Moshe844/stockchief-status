name: Verify production monitor
on:
  pull_request:
  push:
    branches: [main]
    paths: ['monitor.mjs','loop.mjs','monitor.test.mjs','site/status-state.mjs','.github/workflows/test.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: node --test monitor.test.mjs
